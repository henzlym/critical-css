<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none">
  <defs>
    <!-- SpeedKit Theme Gradients -->
    <linearGradient id="etherealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e7ce2"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5e7ce2"/>
    </linearGradient>
    <linearGradient id="warningGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e54c4c"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 33, 48, 0.9)"/>
      <stop offset="100%" stop-color="rgba(30, 33, 48, 0.98)"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTeal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5e7ce2"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b35"/>
    </marker>

    <!-- Blocked Pattern -->
    <pattern id="blockedPattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#16171d"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9ca8c4" stroke-width="1"/>
    </pattern>
    <rect width="900" height="600" fill="url(#grid)"/>
  </g>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#f0f2f8">How the Preload Scanner Speeds Up Resource Discovery</text>
  <text x="450" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#9ca8c4">The browser's secret weapon for faster page loads</text>

  <!-- Timeline Header -->
  <g transform="translate(50, 75)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9ca8c4" text-transform="uppercase" letter-spacing="1">TIME</text>
    <line x1="35" y1="-5" x2="800" y2="-5" stroke="#5e7ce2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- HTML Document Column (Left) -->
  <g transform="translate(30, 95)">
    <!-- HTML Document Card -->
    <rect width="140" height="420" rx="12" fill="url(#glassGradient)" stroke="rgba(156, 168, 196, 0.15)" stroke-width="1"/>
    <rect width="140" height="4" rx="2" fill="url(#etherealGradient)" y="0"/>

    <text x="70" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0f2f8">HTML Document</text>

    <!-- HTML Structure -->
    <g transform="translate(15, 40)">
      <!-- DOCTYPE -->
      <text x="0" y="15" font-family="Monaco, Consolas, monospace" font-size="9" fill="#9ca8c4">&lt;!DOCTYPE&gt;</text>

      <!-- Head section -->
      <rect x="0" y="25" width="110" height="60" rx="4" fill="rgba(94, 124, 226, 0.1)" stroke="#5e7ce2" stroke-width="1"/>
      <text x="5" y="40" font-family="Monaco, Consolas, monospace" font-size="9" fill="#a855f7">&lt;head&gt;</text>
      <text x="10" y="55" font-family="Monaco, Consolas, monospace" font-size="8" fill="#2dd4bf">&lt;link css&gt;</text>
      <text x="10" y="68" font-family="Monaco, Consolas, monospace" font-size="8" fill="#ff6b35">&lt;script&gt;</text>
      <text x="5" y="81" font-family="Monaco, Consolas, monospace" font-size="9" fill="#a855f7">&lt;/head&gt;</text>

      <!-- Body section -->
      <rect x="0" y="95" width="110" height="280" rx="4" fill="rgba(45, 212, 191, 0.05)" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="5" y="110" font-family="Monaco, Consolas, monospace" font-size="9" fill="#a855f7">&lt;body&gt;</text>

      <!-- Hero image -->
      <rect x="8" y="120" width="94" height="25" rx="3" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
      <text x="55" y="137" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="8" fill="#a855f7">&lt;img hero&gt;</text>

      <!-- Font usage -->
      <rect x="8" y="155" width="94" height="25" rx="3" fill="rgba(94, 124, 226, 0.15)" stroke="#5e7ce2" stroke-width="1"/>
      <text x="55" y="172" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="8" fill="#5e7ce2">Font in CSS</text>

      <!-- More content -->
      <rect x="8" y="190" width="94" height="20" rx="3" fill="rgba(156, 168, 196, 0.1)"/>
      <rect x="8" y="220" width="94" height="20" rx="3" fill="rgba(156, 168, 196, 0.1)"/>
      <rect x="8" y="250" width="70" height="20" rx="3" fill="rgba(156, 168, 196, 0.1)"/>

      <!-- Below fold image -->
      <rect x="8" y="280" width="94" height="25" rx="3" fill="rgba(156, 168, 196, 0.1)" stroke="#9ca8c4" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="55" y="297" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="8" fill="#9ca8c4">&lt;img below&gt;</text>

      <!-- Script at end -->
      <rect x="8" y="315" width="94" height="25" rx="3" fill="rgba(255, 107, 53, 0.15)" stroke="#ff6b35" stroke-width="1"/>
      <text x="55" y="332" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="8" fill="#ff6b35">&lt;script defer&gt;</text>

      <text x="5" y="365" font-family="Monaco, Consolas, monospace" font-size="9" fill="#a855f7">&lt;/body&gt;</text>
    </g>
  </g>

  <!-- Main Parser Lane -->
  <g transform="translate(190, 95)">
    <!-- Lane Header -->
    <rect width="320" height="30" rx="6" fill="rgba(94, 124, 226, 0.2)" stroke="#5e7ce2" stroke-width="1"/>
    <circle cx="15" cy="15" r="6" fill="#5e7ce2" filter="url(#glowBlue)"/>
    <text x="30" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0f2f8">Main HTML Parser</text>
    <text x="180" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">(builds DOM, can be blocked)</text>

    <!-- Parser Progress Bar -->
    <g transform="translate(0, 45)">
      <!-- Background track -->
      <rect width="320" height="50" rx="8" fill="rgba(30, 33, 48, 0.8)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>

      <!-- Parse head - fast -->
      <rect x="5" y="5" width="60" height="40" rx="4" fill="rgba(94, 124, 226, 0.3)" stroke="#5e7ce2" stroke-width="1"/>
      <text x="35" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#5e7ce2">Parse</text>
      <text x="35" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca8c4">&lt;head&gt;</text>

      <!-- BLOCKED section -->
      <rect x="70" y="5" width="120" height="40" rx="4" fill="url(#blockedPattern)" stroke="#ff6b35" stroke-width="2"/>
      <rect x="70" y="5" width="120" height="40" rx="4" fill="rgba(255, 107, 53, 0.15)"/>
      <text x="130" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ff6b35">BLOCKED</text>
      <text x="130" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca8c4">waiting for script.js</text>

      <!-- Resume parsing -->
      <rect x="195" y="5" width="120" height="40" rx="4" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="255" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#2dd4bf">Continue Parsing</text>
      <text x="255" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca8c4">&lt;body&gt; content</text>
    </g>

    <!-- Blocking indicator arrow -->
    <path d="M 130 100 L 130 130" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="140" y="125" font-family="system-ui, sans-serif" font-size="9" fill="#ff6b35">Script blocks parser!</text>
  </g>

  <!-- Preload Scanner Lane -->
  <g transform="translate(190, 250)">
    <!-- Lane Header -->
    <rect width="320" height="30" rx="6" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="15" cy="15" r="6" fill="#2dd4bf" filter="url(#glowTeal)"/>
    <text x="30" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0f2f8">Preload Scanner</text>
    <text x="175" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">(scans ahead, never blocked)</text>

    <!-- Scanner Progress -->
    <g transform="translate(0, 45)">
      <rect width="320" height="50" rx="8" fill="rgba(30, 33, 48, 0.8)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>

      <!-- Idle initially -->
      <rect x="5" y="5" width="60" height="40" rx="4" fill="rgba(156, 168, 196, 0.1)" stroke="rgba(156, 168, 196, 0.3)" stroke-width="1"/>
      <text x="35" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9ca8c4">Idle</text>

      <!-- Active scanning -->
      <rect x="70" y="5" width="245" height="40" rx="4" fill="rgba(45, 212, 191, 0.25)" stroke="#2dd4bf" stroke-width="2"/>
      <text x="192" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2dd4bf">SCANNING AHEAD</text>
      <text x="192" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca8c4">Discovers: fonts, images, stylesheets, scripts</text>

      <!-- Scan lines animation hint -->
      <g opacity="0.6">
        <line x1="80" y1="40" x2="100" y2="40" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="110" y1="40" x2="150" y2="40" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="160" y1="40" x2="220" y2="40" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="230" y1="40" x2="280" y2="40" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="290" y1="40" x2="310" y2="40" stroke="#2dd4bf" stroke-width="2"/>
      </g>
    </g>

    <!-- Discovery callouts -->
    <g transform="translate(75, 105)">
      <path d="M 20 0 L 20 20 L 0 30" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)"/>
      <path d="M 80 0 L 80 25 L 60 35" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)"/>
      <path d="M 140 0 L 140 20 L 160 30" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)"/>
      <path d="M 200 0 L 200 25 L 220 35" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)"/>
    </g>
  </g>

  <!-- Network Fetches Lane -->
  <g transform="translate(190, 420)">
    <!-- Lane Header -->
    <rect width="550" height="30" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
    <circle cx="15" cy="15" r="6" fill="#a855f7"/>
    <text x="30" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0f2f8">Network Fetches</text>
    <text x="175" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">(parallel downloads)</text>

    <!-- Fetch Timeline -->
    <g transform="translate(0, 40)">
      <rect width="550" height="90" rx="8" fill="rgba(30, 33, 48, 0.8)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>

      <!-- CSS Fetch -->
      <g transform="translate(10, 8)">
        <rect width="100" height="22" rx="4" fill="rgba(45, 212, 191, 0.3)" stroke="#2dd4bf" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#2dd4bf">style.css</text>
      </g>

      <!-- Script Fetch (blocking) -->
      <g transform="translate(10, 35)">
        <rect width="180" height="22" rx="4" fill="rgba(255, 107, 53, 0.3)" stroke="#ff6b35" stroke-width="2"/>
        <text x="90" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#ff6b35">script.js (render-blocking)</text>
      </g>

      <!-- Font Fetch - discovered by preload scanner! -->
      <g transform="translate(120, 8)">
        <rect width="150" height="22" rx="4" fill="rgba(94, 124, 226, 0.3)" stroke="#5e7ce2" stroke-width="1"/>
        <text x="75" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#5e7ce2">font.woff2</text>
        <text x="160" y="15" font-family="system-ui, sans-serif" font-size="8" fill="#2dd4bf">*</text>
      </g>

      <!-- Hero Image - discovered by preload scanner! -->
      <g transform="translate(200, 35)">
        <rect width="130" height="22" rx="4" fill="rgba(168, 85, 247, 0.3)" stroke="#a855f7" stroke-width="1"/>
        <text x="65" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#a855f7">hero.jpg</text>
        <text x="140" y="15" font-family="system-ui, sans-serif" font-size="8" fill="#2dd4bf">*</text>
      </g>

      <!-- Deferred script -->
      <g transform="translate(340, 35)">
        <rect width="100" height="22" rx="4" fill="rgba(156, 168, 196, 0.2)" stroke="#9ca8c4" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9ca8c4">app.js defer</text>
        <text x="110" y="15" font-family="system-ui, sans-serif" font-size="8" fill="#2dd4bf">*</text>
      </g>

      <!-- Below fold image (low priority) -->
      <g transform="translate(450, 35)">
        <rect width="90" height="22" rx="4" fill="rgba(156, 168, 196, 0.1)" stroke="rgba(156, 168, 196, 0.3)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="45" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca8c4">footer.jpg</text>
      </g>

      <!-- Legend -->
      <g transform="translate(10, 68)">
        <circle cx="5" cy="5" r="4" fill="#2dd4bf"/>
        <text x="15" y="9" font-family="system-ui, sans-serif" font-size="9" fill="#2dd4bf">* Discovered by preload scanner while parser was blocked</text>
      </g>
    </g>
  </g>

  <!-- Key Insight Box -->
  <g transform="translate(530, 95)">
    <rect width="340" height="280" rx="16" fill="url(#glassGradient)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
    <rect width="340" height="4" rx="2" fill="url(#successGradient)" y="0"/>

    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f0f2f8">Why This Matters</text>

    <!-- Without preload scanner -->
    <g transform="translate(20, 50)">
      <rect width="300" height="70" rx="8" fill="rgba(255, 107, 53, 0.1)" stroke="#ff6b35" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ff6b35">Without Preload Scanner:</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Parser blocked by script.js</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Fonts, images wait until parser resumes</text>
      <text x="10" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#ff6b35">= Slower LCP, delayed rendering</text>
    </g>

    <!-- With preload scanner -->
    <g transform="translate(20, 130)">
      <rect width="300" height="70" rx="8" fill="rgba(45, 212, 191, 0.1)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">With Preload Scanner:</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Scanner reads ahead during block</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Discovers fonts, images, starts fetching</text>
      <text x="10" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#2dd4bf">= Resources ready when parser resumes!</text>
    </g>

    <!-- Pro tip -->
    <g transform="translate(20, 215)">
      <rect width="300" height="50" rx="8" fill="rgba(94, 124, 226, 0.15)" stroke="#5e7ce2" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#5e7ce2">Pro Tip:</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Use &lt;link rel="preload"&gt; to tell the browser</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">about critical resources even earlier!</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(50, 565)">
    <rect width="800" height="28" rx="6" fill="rgba(30, 33, 48, 0.8)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>

    <g transform="translate(20, 0)">
      <rect x="0" y="8" width="12" height="12" rx="2" fill="rgba(94, 124, 226, 0.3)" stroke="#5e7ce2" stroke-width="1"/>
      <text x="18" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Main Parser</text>
    </g>

    <g transform="translate(140, 0)">
      <rect x="0" y="8" width="12" height="12" rx="2" fill="rgba(45, 212, 191, 0.3)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="18" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Preload Scanner</text>
    </g>

    <g transform="translate(290, 0)">
      <rect x="0" y="8" width="12" height="12" rx="2" fill="rgba(255, 107, 53, 0.3)" stroke="#ff6b35" stroke-width="1"/>
      <text x="18" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Blocked/Render-blocking</text>
    </g>

    <g transform="translate(470, 0)">
      <rect x="0" y="8" width="12" height="12" rx="2" fill="rgba(168, 85, 247, 0.3)" stroke="#a855f7" stroke-width="1"/>
      <text x="18" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Network Fetch</text>
    </g>

    <g transform="translate(610, 0)">
      <rect x="0" y="8" width="12" height="12" rx="2" fill="rgba(156, 168, 196, 0.1)" stroke="rgba(156, 168, 196, 0.3)" stroke-width="1" stroke-dasharray="2,1"/>
      <text x="18" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Low Priority</text>
    </g>
  </g>
</svg>
