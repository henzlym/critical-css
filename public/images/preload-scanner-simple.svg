<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" fill="none">
  <defs>
    <!-- SpeedKit Theme Gradients -->
    <linearGradient id="etherealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e7ce2"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5e7ce2"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 33, 48, 0.9)"/>
      <stop offset="100%" stop-color="rgba(30, 33, 48, 0.98)"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTeal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blocked Pattern -->
    <pattern id="blockedPattern" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="#16171d"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f0f2f8">Main Parser vs Preload Scanner</text>
  <text x="350" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9ca8c4">How browsers discover resources faster</text>

  <!-- Column 1: Main HTML Parser -->
  <g transform="translate(40, 80)">
    <!-- Column Header -->
    <rect width="290" height="40" rx="8" fill="rgba(94, 124, 226, 0.15)" stroke="#5e7ce2" stroke-width="1"/>
    <circle cx="20" cy="20" r="8" fill="#5e7ce2" filter="url(#glowBlue)"/>
    <text x="38" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f0f2f8">Main HTML Parser</text>

    <!-- Timeline -->
    <g transform="translate(0, 55)">
      <!-- Step 1: Parse head -->
      <rect width="290" height="50" rx="8" fill="url(#glassGradient)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>
      <rect x="15" y="12" width="260" height="26" rx="4" fill="rgba(94, 124, 226, 0.25)" stroke="#5e7ce2" stroke-width="1"/>
      <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5e7ce2">Parsing &lt;head&gt;...</text>

      <!-- Step 2: BLOCKED -->
      <g transform="translate(0, 60)">
        <rect width="290" height="120" rx="8" fill="url(#glassGradient)" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1"/>

        <!-- Blocked bar with pattern -->
        <rect x="15" y="12" width="260" height="96" rx="6" fill="url(#blockedPattern)"/>
        <rect x="15" y="12" width="260" height="96" rx="6" fill="rgba(255, 107, 53, 0.1)"/>

        <!-- Stop icon -->
        <g transform="translate(125, 35)">
          <circle cx="20" cy="20" r="18" fill="none" stroke="#ff6b35" stroke-width="2"/>
          <rect x="10" y="18" width="20" height="4" rx="2" fill="#ff6b35"/>
        </g>

        <text x="145" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff6b35">BLOCKED</text>
        <text x="145" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Waiting for render-blocking script...</text>
      </g>

      <!-- Step 3: Resume -->
      <g transform="translate(0, 190)">
        <rect width="290" height="50" rx="8" fill="url(#glassGradient)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>
        <rect x="15" y="12" width="260" height="26" rx="4" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="1"/>
        <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2dd4bf">Resume parsing &lt;body&gt;</text>
      </g>
    </g>

    <!-- Result label -->
    <g transform="translate(0, 310)">
      <rect width="290" height="45" rx="8" fill="rgba(255, 107, 53, 0.1)" stroke="#ff6b35" stroke-width="1"/>
      <text x="145" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ff6b35">Resources discovered LATE</text>
      <text x="145" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Fonts &amp; images wait for parser to reach them</text>
    </g>
  </g>

  <!-- Column 2: Preload Scanner -->
  <g transform="translate(370, 80)">
    <!-- Column Header -->
    <rect width="290" height="40" rx="8" fill="rgba(45, 212, 191, 0.15)" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="20" cy="20" r="8" fill="#2dd4bf" filter="url(#glowTeal)"/>
    <text x="38" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f0f2f8">Preload Scanner</text>

    <!-- Timeline -->
    <g transform="translate(0, 55)">
      <!-- Step 1: Idle -->
      <rect width="290" height="50" rx="8" fill="url(#glassGradient)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>
      <rect x="15" y="12" width="260" height="26" rx="4" fill="rgba(156, 168, 196, 0.1)" stroke="rgba(156, 168, 196, 0.3)" stroke-width="1"/>
      <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9ca8c4">Idle (parser not blocked yet)</text>

      <!-- Step 2: SCANNING -->
      <g transform="translate(0, 60)">
        <rect width="290" height="120" rx="8" fill="url(#glassGradient)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>

        <!-- Active scanning area -->
        <rect x="15" y="12" width="260" height="96" rx="6" fill="rgba(45, 212, 191, 0.15)" stroke="#2dd4bf" stroke-width="2"/>

        <!-- Scan icon -->
        <g transform="translate(115, 25)">
          <circle cx="25" cy="20" r="16" fill="none" stroke="#2dd4bf" stroke-width="2"/>
          <line x1="37" y1="32" x2="48" y2="43" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Discovery items -->
        <g transform="translate(40, 60)">
          <circle cx="0" cy="8" r="4" fill="#a855f7"/>
          <text x="12" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#f0f2f8">hero.jpg discovered</text>
        </g>
        <g transform="translate(40, 80)">
          <circle cx="0" cy="8" r="4" fill="#5e7ce2"/>
          <text x="12" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#f0f2f8">font.woff2 discovered</text>
        </g>

        <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">SCANNING AHEAD</text>
      </g>

      <!-- Step 3: Done -->
      <g transform="translate(0, 190)">
        <rect width="290" height="50" rx="8" fill="url(#glassGradient)" stroke="rgba(156, 168, 196, 0.1)" stroke-width="1"/>
        <rect x="15" y="12" width="260" height="26" rx="4" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="1"/>
        <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2dd4bf">Resources already fetching!</text>
      </g>
    </g>

    <!-- Result label -->
    <g transform="translate(0, 310)">
      <rect width="290" height="45" rx="8" fill="rgba(45, 212, 191, 0.1)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="145" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">Resources discovered EARLY</text>
      <text x="145" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8c4">Downloads start while parser is blocked</text>
    </g>
  </g>

  <!-- VS Divider -->
  <g transform="translate(340, 200)">
    <circle cx="10" cy="30" r="18" fill="#1e2130" stroke="rgba(156, 168, 196, 0.2)" stroke-width="1"/>
    <text x="10" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9ca8c4">VS</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(40, 410)">
    <rect width="620" height="32" rx="6" fill="rgba(94, 124, 226, 0.1)" stroke="rgba(94, 124, 226, 0.3)" stroke-width="1"/>
    <text x="310" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9ca8c4">
      <tspan font-weight="600" fill="#5e7ce2">Pro tip:</tspan> Use &lt;link rel="preload"&gt; to hint critical resources even earlier
    </text>
  </g>
</svg>
